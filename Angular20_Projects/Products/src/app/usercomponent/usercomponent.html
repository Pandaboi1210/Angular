<div class="bg-[url('/image.png')] bg-no-repeat bg-center h-48 w-full mx-auto">
  <h1 class="text-blue-300 text-5xl text-center py-20">
    Products In Offer
  </h1>
</div>
<br>
<br>
<div class="flex-wrap flex justify-evenly gap-4">

  @for (i of userData; track i) {

    <div class="border rounded-lg w-72 p-4 shadow shadow-purple-400">

      <img
  class="w-full h-48 object-contain bg-gray-100 rounded"
  src="{{ i.image }}"
>

      <p class="font-bold text-lg mt-2 text-blue-200">
        {{ i.title }}
      </p>
  <p class="text-green-600 font-semibold text-lg mt-2">
        ₹ {{ i.price }}
      </p>

      <div class="flex justify-between mt-4">

        <button class="bg-blue-600 text-white px-4 py-2 rounded">
          Buy Now
        </button>

        <button class="bg-green-600 text-white px-4 py-2 rounded">
          Add to Cart
        </button>

      </div>

    </div>

  }

</div>
