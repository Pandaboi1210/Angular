<form #form="ngForm" (ngSubmit)="handleSubmit(form)" 
class="h-1/2 w-1/3 flex flex-col items-center bg-white text-black shadow-2xl shadow-black/20 rounded-xl p-6">
    <h1 class="text-2xl font-bold mb-4">Sign Up Form</h1>
    <input type="text" name="username" placeholder="Username" ngModel #inp1="ngModel" class="h-10 w-full border border-black rounded-md outline-none px-4 my-2">
    <input type="email" name="email" placeholder="Email" ngModel #inp2="ngModel" class="h-10 w-full border border-black rounded-md outline-none px-4 my-2">
    <input type="password" name="password" placeholder="Password" ngModel #inp3="ngModel" class="h-10 w-full border border-black rounded-md outline-none px-4 my-2">
    <input type="password" name="confirmpassword" placeholder="Confirm Password" ngModel #inp4="ngModel" class="h-10 w-full border border-black rounded-md outline-none px-4 my-2">
    <input type="tel" name="phoneno" placeholder="Phone Number" ngModel #inp5="ngModel" class="h-10 w-full border border-black rounded-md outline-none px-4 my-2">
    <button class="h-10 w-24 mt-4 bg-black text-white rounded-md hover:bg-gray-800 transition"> Submit </button>
</form>
